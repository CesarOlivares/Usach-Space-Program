<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | USACH Space Program</title>
    <meta name="description" content="Portal interno del USACH Space Program, restringido a la coordinación del programa.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#030508">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <script type="module" crossorigin src="/assets/login-BaH9cw_q.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/main-CCsEX5q6.js">
  <link rel="modulepreload" crossorigin href="/assets/supabase-0-bjmVk9.js">
  <link rel="stylesheet" crossorigin href="/assets/main-CQvejsbw.css">
  <link rel="stylesheet" crossorigin href="/assets/login-DKCQihDX.css">
</head>
<body class="acceso">
    <main class="acceso-main">
        <a href="/" class="acceso-marca">
            <img src="/assets/logo_noTextBLACK-ged7tvfL.png" alt="" width="36" height="36">
            <span>USACH Space Program</span>
        </a>

        <form class="acceso-card" id="loginForm" novalidate>
            <p class="acceso-eyebrow">Panel interno</p>
            <h1>Ingresar</h1>
            <p class="acceso-lede">Acceso solo para la directiva. Si necesitas una cuenta, pídesela a la presidencia del programa.</p>

            <label class="acceso-campo">
                <span>Correo</span>
                <input type="email" name="email" autocomplete="username" placeholder="nombre@usach.cl" required>
            </label>
            <label class="acceso-campo">
                <span>Contraseña</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>

            <p class="acceso-error" id="loginError" role="alert" hidden></p>

            <button type="submit" class="acceso-btn" id="loginBtn">Entrar</button>
            <a href="/" class="acceso-volver">← Volver al sitio</a>
        </form>
    </main>

</body>
</html>
